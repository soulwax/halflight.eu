[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "syn-stream-worker"
version = "0.1.0"
description = "Self-hosted, PostgreSQL-backed media job worker for Syn"
requires-python = ">=3.12"
dependencies = [
	"asyncpg>=0.29,<1",
	"boto3>=1.35,<2",
	"fastapi>=0.115,<1",
	"httpx>=0.27,<1",
	"pydantic>=2.9,<3",
	"sqlalchemy[asyncio]>=2.0,<3",
	"uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = [
	"pytest>=8.3,<9",
	"pytest-asyncio>=0.24,<1",
	"ruff>=0.8,<1"
]

[project.scripts]
syn-stream-worker = "syn_worker.main:run_api"
syn-stream-worker-runner = "syn_worker.runner:run"

[tool.hatch.build.targets.wheel]
packages = ["src/syn_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
